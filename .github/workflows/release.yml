# Build release bundle, attach zip + latest.json, bump version.
# Chay: tab Actions -> "Publish GitHub Release" -> Run workflow.
# May nguoi dung: manifest_url = .../releases/latest/download/latest.json

name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump (version.json + latest.json)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      notes:
        description: Release notes (optional)
        type: string
        default: ""
      push_version_commit:
        description: "Sau release: git push version.json + release/update/latest.json (canh bao: branch protection co the chan)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: toolfb-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      # Giong build_exe_gui: bundle browsers vao dist/.../_internal qua duong cache co dinh trong workspace (de Actions cache hit).
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" "pyinstaller-hooks-contrib>=2024.0"

      - name: Resolve Playwright version (cache key)
        id: playwright-ver
        shell: bash
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-py312-pw-${{ steps.playwright-ver.outputs.version }}-${{ hashFiles('requirements.txt') }}

      - name: Setup GitHub CLI
        uses: cli/gh-actions/setup-gh@v2

      - name: Build and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "${{ inputs.notes }}"
          $publishArgs = @(
            "tools/publish_all.py",
            "--repo", "${{ github.repository }}",
            "--bump", "${{ inputs.bump }}",
            "--no-write-update-channel"
          )
          if ($notes.Trim().Length -gt 0) {
            $publishArgs += "--notes"
            $publishArgs += $notes
          }
          python @publishArgs

      - name: Commit synced version and manifest to repo
        if: success() && inputs.push_version_commit == true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json release/update/latest.json
          $porcelain = git status --porcelain -- version.json release/update/latest.json
          if ([string]::IsNullOrWhiteSpace($porcelain)) {
            Write-Host "No staged changes for version.json / release/update/latest.json."
            exit 0
          }
          git commit -m "chore(release): sync version.json and release manifest [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Step summary (manifest URL for clients)
        if: success()
        shell: pwsh
        run: |
          $m = "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          @"
          ### Auto-update (manifest_url)
          - ``$m``
          - Ghi vao ``config/update_channel.json`` roi commit de ban build co kenh cap nhat.
          - Tuy chon workflow: bat ``push_version_commit`` de day ``version.json`` + ``release/update/latest.json`` len nhanh sau build (can branch ghi duoc, khong bi rule chan push).
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
